services:
  postgres:
    image: postgres:16
    container_name: desenrola-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: desenrola
      POSTGRES_PASSWORD: desenrola123
      POSTGRES_DB: desenrola
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data

volumes:
  postgres_data: